<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <title>Aisle not found | Franks' AV Warehouse</title>
    <style>
      :root { font-family: "Arial Narrow", "Avenir Next Condensed", Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f4f0e5; color: #11130f; }
      main { width: min(720px, calc(100% - 40px)); padding: clamp(32px, 7vw, 72px); border: 3px solid #11130f; background: #f5b82e; box-shadow: 12px 12px 0 #11130f; }
      p:first-child { margin-top: 0; font: 800 .72rem/1.2 "SFMono-Regular", Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; }
      h1 { max-width: 620px; margin: 0 0 1rem; font-size: clamp(4rem, 14vw, 8rem); font-weight: 900; letter-spacing: -.075em; line-height: .82; text-transform: uppercase; }
      p { max-width: 560px; font-size: 1.05rem; line-height: 1.65; }
      a { display: inline-block; margin-top: 1.5rem; padding: .95rem 1.2rem; border: 2px solid #11130f; background: #11130f; color: #fffdf7; font: 900 .72rem/1.2 "SFMono-Regular", Consolas, monospace; text-decoration: none; text-transform: uppercase; }
      a:hover { transform: translate(-3px, -3px); box-shadow: 6px 6px 0 #fffdf7; }
    </style>
  </head>
  <body>
    <main>
      <p>Error 404 / Forklift route unavailable</p>
      <h1>Wrong aisle.</h1>
      <p>We checked this location with the same care as our malware scanner and found absolutely nothing.</p>
      <a href="/">Return to the loading dock</a>
    </main>
  </body>
</html>
